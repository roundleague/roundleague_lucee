<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Under Construction</title>
    <style>
      body {
        background: #222;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 10vh;
      }
      .container {
        background: #333;
        border-radius: 12px;
        padding: 40px 20px;
        display: inline-block;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 2.5em;
        margin-bottom: 0.5em;
      }
      p {
        font-size: 1.2em;
      }
      .icon {
        font-size: 4em;
        margin-bottom: 0.5em;
        color: #ffb347;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <img
          src="https://static.wixstatic.com/media/b16829_f3a215a62a9f485990b0e43a0a993d3d~mv2.png/v1/fill/w_300,h_110,al_c,q_85,usm_0.66_1.00_0.01/4_edited.webp"
          alt="The Round League Logo"
          style="max-width: 300px; max-height: 110px"
        />
      </div>
      <h1>We're Under Construction</h1>
      <p>
        <em
          >Even the best teams need a timeout. We're drawing up a new play!</em
        >
      </p>
    </div>
  </body>
</html>
